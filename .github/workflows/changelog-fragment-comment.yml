---
# Companion workflow: posts changelog fragment results as PR comments.
# Uses workflow_run trigger (fork-safe pattern).
# Jira: AAP-86434 (AC4), AAP-92950
name: "API: Changelog Fragment Comment"

on:
  workflow_run:
    workflows: ["API: Changelog Fragment Enforcement"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    uses: ansible/actions/.github/workflows/openapi-post-changelog-comment.yml@main
