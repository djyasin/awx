---
# Caller workflow for changelog fragment enforcement.
# Consumes reusable workflow from djyasin/actions (PR #167).
# Jira: AAP-86434 (AC4), AAP-92950
name: "API: Changelog Fragment Enforcement"

on:
  pull_request:
    branches:
      - devel
      - release_**
      - feature_**
      - stable-**
      - AAP-86434-*
    paths:
      - 'schema.json'
      - 'changelogs/fragments/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    # djyasin/actions PR #167 — pinned to current HEAD
    uses: djyasin/actions/.github/workflows/openapi-changelog-fragment.yml@feat/changelog-fragment-enforcement # PR #167 HEAD: c420d10
    with:
      spec-paths: "schema.json"
      fragment-dir: "changelogs/fragments"
