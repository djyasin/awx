---
# Companion workflow: posts oasdiff breaking change results as PR comments.
# Uses workflow_run trigger (fork-safe pattern).
# Jira: AAP-86434 (AC1)
name: "API: Breaking Change Comment"

on:
  workflow_run:
    workflows: ["API: Breaking Change Detection"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    # djyasin/actions PR #161 — pinned to current HEAD
    uses: djyasin/actions/.github/workflows/oasdiff-post-breaking-change-comment.yml@feat/oasdiff-breaking-change-detection # PR #161 HEAD: 33e68a1
