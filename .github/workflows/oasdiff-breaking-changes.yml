---
# Caller workflow for oasdiff breaking change detection.
# Consumes reusable workflow from ansible/actions (PR #161).
# Jira: AAP-86434 (AC1, AC2, AC4)
name: "API: Breaking Change Detection"

on:
  pull_request:
    branches:
      - devel
      - release_**
      - feature_**
      - stable-**
      - AAP-86434/**

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    # ansible/actions PR #161 — pinned to current HEAD
    uses: ansible/actions/.github/workflows/oasdiff-detect-breaking-changes.yml@feat/oasdiff-breaking-change-detection # PR #161 HEAD: 33e68a1
    with:
      spec-path: schema.json
